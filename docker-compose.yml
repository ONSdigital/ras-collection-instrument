services:
  db:
    container_name: postgres_collection_instrument
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: postgres
    # Single source of truth, shared with CI. Requires --env-file _infra/postgres-image,
    # so start this with `make start-db` rather than a bare `docker compose up`.
    image: ${POSTGRES_IMAGE}
    ports:
      - "6432:5432"

  ras-collection-instrument:
    container_name: ras-collection-instrument
    build:
      context: .
      dockerfile: _infra/docker/Dockerfile
    restart: always
    depends_on:
      - db
    ports:
      - "8081:8081"
